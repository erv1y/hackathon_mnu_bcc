<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Проверьте техническое задание до разработки. Найдите риски в платежах, защите данных и требованиях и получите варианты исправлений.">
  <title>{{ title }}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css?v=15">
  <link rel="stylesheet" href="/static/motion.css?v=6">
  <link rel="stylesheet" href="/static/agent-scene.css?v=1">
  <script src="/static/motion.js?v=6" defer blocking="render"></script>
  <script src="/static/i18n.js?v=13" defer></script>
  <script src="/static/history.js?v=3" defer></script>
  <script src="/static/hero-scene.js?v=3" defer></script>
  <script src="/static/product-review.js?v=1" defer></script>
  <script src="/static/review-tools.js?v=6" defer></script>
  <script src="/static/audit-extras.js?v=4" defer></script>
  <script src="/static/print-report.js?v=1" defer></script>
  <script src="/static/app.js?v=17" defer></script>
  <script type="module" src="/static/agent-scene/index.js?v=1"></script>
</head>
<body data-page="{{ page }}">
  <div id="auth-overlay" class="auth-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <form id="auth-form" class="auth-card">
      <div class="auth-heading">
        <h2 id="auth-title" data-msg="signIn">Вход на стенд</h2>
        <select data-language data-label="language" aria-label="Язык сайта"><option value="ru">Русский</option><option value="kk">Қазақша</option><option value="en">English</option></select>
      </div>
      <label for="password-input" data-msg="password">Пароль доступа</label>
      <input type="password" id="password-input" autocomplete="current-password" required>
      <button type="submit" class="btn-primary" data-msg="enter">Войти</button>
      <p id="auth-error" class="error-text hidden" role="alert"></p>
    </form>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <div id="workspace" class="container">
    <header class="nav" id="top">
      <a class="brand" href="/"><svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true"><path d="M16 2.5 4.5 7v8.2c0 7 4.6 12.2 11.5 14.3 6.9-2.1 11.5-7.3 11.5-14.3V7L16 2.5Z" stroke-width="2.2" stroke-linejoin="round"/><path d="m10.5 15.8 4 4 7-7.6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>REQUIRAGENTS</span></a>
      <nav class="nav-pill" aria-label="Разделы" data-label="sections">
        <a href="/" data-nav="home" data-msg="navHome">Обзор</a>
        <a href="/audit" data-nav="audit" data-msg="navAudit">Проверка</a>
        <a href="/how" data-nav="how" data-msg="navHow">Как это работает</a>
      </nav>
      <div class="nav-side">
        <div id="status-badge" class="status-badge" role="status"><span class="dot" aria-hidden="true"></span><span id="status-text">Проверяем подключение</span></div>
        <button id="scene-toggle" type="button" class="depth-toggle hidden" aria-pressed="false" data-label="sceneToggle" aria-label="3D-режим">
          <span class="depth-toggle-mark" aria-hidden="true"></span>3D
        </button>
        <select data-language data-label="language" aria-label="Язык сайта"><option value="ru">Русский</option><option value="kk">Қазақша</option><option value="en">English</option></select>
      </div>
    </header>

    <a class="skip-link" href="#route-scene" data-msg="skipContent">К содержанию</a>
    <div id="route-scene" tabindex="-1">
      <!-- PAGE CONTENT -->
    </div>
  </div>
</body>
</html>
